  P(r.kind==='ask'?`${r.from} asked you out. Say yes to start dating. ${r.from} would be your ${t}.`:r.kind==='propose'?`${r.from} got down on one knee with a ${r.extra||'ring'} and asked you to marry them!`:`${r.from} booked a ${(WED_PKGS[+r.extra]||WED_PKGS[0])[0].toLowerCase()} and invited you to your wedding!`);

function relAnswer(i,yes){const r=S.relReqs[i];if(!r)return;S.relReqs.splice(i,1);const f=r.from;
 if(!yes){relSend(f,r.kind+'no');save();say(`You said no to ${f}.`);relReqScreen();return}
 if(needWord(()=>{S.relReqs.splice(i,0,r);relAnswer(i,true)}))return;
 if(S.rel&&!sameName(S.rel.with,f)){sfx.error();say(`You are already with ${S.rel.with}. Break up first.`);S.relReqs.splice(i,0,r);return}
 if(!(S.friends||[]).some(x=>sameName(x,f)))S.friends.push(f);
 if(r.kind==='ask'){S.rel={with:f,st:'dating',word:r.word,since:Date.now(),love:0};relSend(f,'askyes');sfx.levelup();say(`You said yes! You and ${f} are dating. ${f} is your ${myRelTitle()}. Plan a date from ${f}'s friend page.`)}
 else if(r.kind==='propose'){S.rel=Object.assign(S.rel||{with:f,word:r.word,since:Date.now(),love:0},{st:'engaged',ring:r.extra});S.stuff.push('Engagement ring from '+f);relSend(f,'propyes');sfx.levelup();say(`You said yes! You and ${f} are engaged! Your ring is in My stuff. Plan your wedding at Magnolia Wedding Chapel.`)}
 else if(r.kind==='wed'){const[pk,kj]=String(r.extra||'0~[]').split('~');S.rel=Object.assign(S.rel||{with:f,word:r.word,since:Date.now(),love:0},{st:'married',wedT:Date.now()});const added=addSpouseKids(f,kj);relSend(f,'wedyes',pk+'~'+kidsJSON());S.stuff.push('Wedding ring');weddingCeremony(f,+pk||0,false);if(added.length)setTimeout(()=>say(`${added.join(' and ')} ${added.length===1?'is':'are'} now your ${added.length===1?'child':'children'} too!`,true),14000)}
 save();relReqScreen()}

 if(['ask','propose','wed'].includes(kind)){S.relReqs=(S.relReqs||[]).filter(r=>!(sameName(r.from,nm)&&r.kind===kind));S.relReqs.push({from:nm,kind,word:w,extra:clean(extra).slice(0,3000),t:Date.now()});sfx.chime();say(kind==='ask'?`${nm} asked you out on a date! Open Love requests in the menu to answer.`:kind==='propose'?`${nm} proposed to you! Open Love requests in the menu to answer.`:`${nm} invited you to your wedding! Open Love requests in the menu to answer.`,true);return}
 const mine=S.rel&&sameName(S.rel.with,nm);
 if(kind==='askyes'&&!S.rel){S.rel={with:nm,st:'dating',word:w,since:Date.now(),love:0};S.relAsked=null;sfx.levelup();say(`${nm} said yes! You are dating. ${nm} is your ${myRelTitle()}.`,true)}
 else if(kind==='propyes'&&mine){S.rel.st='engaged';S.rel.word=w;sfx.levelup();say(`${nm} said yes! You are engaged! Plan your wedding at Magnolia Wedding Chapel.`,true)}
 else if(kind==='wedyes'&&mine){const[pk,kj]=String(extra).split('~');S.rel.st='married';S.rel.word=w;S.rel.wedT=Date.now();S.stuff.push('Wedding ring');const added=addSpouseKids(nm,kj);weddingCeremony(nm,+pk||0,true);if(added.length)setTimeout(()=>say(`${added.join(' and ')} ${added.length===1?'is':'are'} now your ${added.length===1?'child':'children'} too!`,true),14000)}
 else if(/no$/.test(kind)){sfx.bad&&sfx.bad();say(`${nm} said no. Maybe another time.`,true)}
 else if(kind==='date'&&mine){S.rel.love=(S.rel.love||0)+1;say(`${nm} took you on a date: ${clean(extra).slice(0,60)}. How sweet!`,true)}

async function pinHash(u,pin){const b=new TextEncoder().encode('acl:'+String(u).trim().toLowerCase()+':'+pin);const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

 return false}

/* ===== Battery saver, easy phone steps, and quick answer ===== */
var QUICK=null;const NAP={idle:false,hidden:false,key:null,ht:null,wt:null};
(function(){const s=document.createElement('style');s.textContent=`body.saver *,body.saver *::before,body.saver *::after{animation:none!important}body.saver .veh,body.saver #actbox{filter:none!important;box-shadow:none!important}

p.steps{background:#132238;border-left:5px solid #7cc4ff;padding:8px 10px;border-radius:8px}`;document.head.append(s)})();
function saverOn(){return !(S&&S.settings&&S.settings.saver===false)}
function saverClass(){try{document.body.classList.toggle('saver',saverOn())}catch(e){}}
function audioBusy(){try{return !!(CALL||(typeof VC!=='undefined'&&VC.on)||document.getElementById('vmsec')||radioIv||busy)}catch(e){return true}}
function napSleep(){if(!AC||audioBusy())return;try{if(AC.state==='running')AC.suspend()}catch(e){}}
function napWake(brief){if(!AC)return;try{if(AC.state!=='running')AC.resume()}catch(e){}
 if(brief&&NAP.idle){clearTimeout(NAP.wt);NAP.wt=setTimeout(()=>{if(NAP.idle)napSleep()},20000)}}
function napEnd(){clearTimeout(NAP.wt);const was=NAP.idle;NAP.idle=false;napWake();if(was&&NAP.key&&!ambKey){const k=NAP.key;NAP.key=null;try{amb(k)}catch(e){}}}
/* do not make background sound nodes at all while background sounds are off */
{const _amb=amb;amb=function(key){if(S&&S.settings&&S.settings.amb===false){if(!AC||key===ambKey)return;stopAmb();ambKey=key;return}_amb(key)}}
/* rest after 10 minutes with no taps */
setInterval(()=>{try{if(!S||!S.started||!AC||!saverOn()||NAP.idle||document.hidden)return;if(Date.now()-LAST_ACT<10*60000||audioBusy())return;
 NAP.idle=true;NAP.key=ambKey;stopAmb();setTimeout(()=>{if(NAP.idle)napSleep()},1500)}catch(e){}},30000);
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,()=>{if(NAP.idle)napEnd()},{passive:true,capture:true}));
/* new messages still make their sound while the game rests */
{const _say=say;say=function(m,u){if(NAP.idle&&!document.hidden)napWake(true);return _say(m,u)}}
/* pause all sound when the game is in the background or the screen is locked */
document.addEventListener('visibilitychange',()=>{try{if(document.hidden){clearTimeout(NAP.ht);if(!saverOn()||(S.settings&&S.settings.bgSound))return;NAP.ht=setTimeout(()=>{if(document.hidden&&!audioBusy()){NAP.hidden=true;napSleep()}},8000)}
 else{clearTimeout(NAP.ht);if(NAP.hidden){NAP.hidden=false;if(!NAP.idle)napWake()}}}catch(e){}});

 B(`Battery saver: ${saverOn()?'on':'off'}`,()=>{st.saver=!saverOn();save();saverClass();sfx.ok();say('Battery saver '+(saverOn()?'on. Your phone stays cooler.':'off.'));refresh()},{k:'saver'});
 B(`Keep sounds playing when the game is in the background: ${st.bgSound?'on':'off'}`,()=>{st.bgSound=!st.bgSound;save();sfx.ok();say(st.bgSound?'Sounds keep playing in the background. This uses more battery.':'Sounds pause in the background to save battery.');refresh()},{k:'bgsound'});

 else if(QUICK&&QUICK.kind==='text'&&Date.now()-QUICK.t<3*60000&&S.phone&&!(cur&&cur.txName&&sameName(cur.txName,QUICK.from))){const f=QUICK.from;d=el('div',{id:'quickbar',role:'group','aria-label':'New text'});

 if(!d)return;h.after(d);if(grab&&!typing()){const b=d.querySelector('button');if(b)b.focus()}}
