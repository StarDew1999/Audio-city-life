<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audio City">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Roamerica</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#0e1320;color:#f3f5fa}
#main{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:1.65rem;line-height:1.25;margin:.3em 0 .2em}
h1:focus,p:focus{outline:none}
h2{font-size:1.15rem;margin:1.3em 0 .35em;color:#ffd479}
p{margin:.5em 0}
.hud{font-size:.95rem;color:#b9c4da;margin-top:0}
button{display:block;width:100%;text-align:left;min-height:58px;margin:9px 0;padding:12px 16px;font:inherit;font-size:1.05rem;color:#fff;background:#223050;border:2px solid #3a4d7a;border-radius:14px;cursor:pointer}
button:active{background:#2c3e66}
button:focus-visible{outline:3px solid #ffd479;outline-offset:2px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,textarea{width:100%;font:inherit;resize:vertical;padding:14px;border-radius:12px;border:2px solid #3a4d7a;background:#0a0e18;color:#fff}
nav{margin-top:28px;border-top:1px solid #33415f;padding-top:6px}
.ic{display:inline-block;width:1.6em;text-align:center;margin-right:.35em;font-size:1.15em}
h1 .ic{font-size:1.1em}
body{background:radial-gradient(ellipse at top,#1b2747 0%,#0e1320 60%)}
nav button{background:#1c2a44}
#msgbar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(20,30,52,.96);border-top:2px solid #ffd479;color:#fff;font-size:.95rem;min-height:1.4em;z-index:5}
#msgbar:empty{display:none}
#main{padding-bottom:120px}
#flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9;font-size:3rem;font-weight:800;color:#fff;text-shadow:0 4px 18px #000;opacity:0;transition:opacity .15s}
#flash.on{opacity:1}
.map{display:block;width:100%;max-width:560px;margin:8px 0 4px;border-radius:14px;background:#13203a;border:2px solid #2d3f66}
.compass{display:flex;align-items:center;gap:14px;margin:6px 0;padding:10px 14px;border-radius:14px;background:#1c2a44;border:2px solid #ffd479;font-weight:700}
.compass .arrow{font-size:2.6rem;line-height:1;transition:transform .3s;color:#ffd479}
.maplegend{font-size:.8rem;color:#b9c4da;margin:0 0 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

const SAVE='audiocity_save_v1';const VERSION='1.24';const WHATSNEW="What's new: Everyday personal care! Your home now has a bathroom. Brush your teeth, floss, wash your face, brush your hair, take a shower, put on deodorant, and use lotion. Finish your whole morning routine for a little health and energy boost. You start with some supplies, and you can buy more in the personal care aisle at any pharmacy or grocery store. Also new: Horseback riding in every state! Every state town has Riding Stables, and Audio City has one too. Pick a horse, pet it, brush it, pick out its hooves, and feed it carrots to bond. Then go on a trail ride and choose to walk, trot, or gallop, and hear the hooves. The more you bond, the happier your horse is to see you. Every state town also has a Feed and Farm Supply store with carrots for horses, seeds, boots, hats, and farm gear. Thanks to YourFavoritePrincess for the idea! Also new: Real live weather! Every town now has the real weather happening there right now, like rain, snow, or sunshine, with the real temperature. It's at the top of every screen, with tomorrow's forecast. The Weather app on your phone gives you the full report. Real time zones: each state has its real time zone. The top of the screen tells you the time in the town you are in. In Settings, under Time zone, choose Follow the real time zone of the town I am in, or keep your own. Every state town now has a mall with 10 stores, a grocery store, and two gas stations: one on Main Street and an Interstate Travel Center. New players can now pick their starting state when they make a character, or when they start over. Also new: Audio City Life is now called Roamerica! Same game, same link, and your game is safe. Now you can travel to all 50 states! Every state has a real city on a real map of the USA, like Seattle, New Orleans, Boston, Las Vegas, and Honolulu. Each one has a bus station, a train depot, a hometown diner with a state favorite food, a famous place to visit, a job you can only get there, and homes and apartments to rent or buy. Long trips are faster by plane: choose Take a flight. Hawaii is across the ocean, so the only way there is by plane. Weather fits each place too, like warm rain in Hawaii and snow in Alaska. Seasons now change on the real first day of each season. Walks take you along the sidewalk, crossing each street at the crosswalk. Battery saver! The game now keeps your phone cooler and makes your battery last longer. It pauses the game's sounds when the game is in the background or your screen is locked, rests the background sounds after 10 minutes with no taps, and turns off moving pictures. Change it in Settings, under Battery and heat. Answering the phone is easier! When someone calls, an Answer button pops up at the top of whatever screen you are on. When you get a text, a Reply button pops up too. The phone, call, text, and chat screens now have step-by-step help at the top. Places are more spread out, and distances are now in feet and miles. When you walk, the game tells you how many feet you have left. Every town is now in a state: Audio City and Maple Falls in North Carolina, Harbor Bay in South Carolina, Pinewood in Tennessee, and Riverton in Georgia. When you drive to another state, you cross the state line. Visit the new town of Bluegrass Hollow, Kentucky, with a horse farm, a horse track, cave tours, a sawmill, a farmers market, a country church, and a lake. Get there by car, taxi, the Intercity Express bus, or the train. New jobs: horse groom, general store clerk, farmers market seller, sawmill worker, vet assistant, cave tour guide, racetrack usher, apple picker, mountain trail guide, and lighthouse keeper. From the last update: Love is in the air! Ask another player out, go on dates, propose with a ring, and get married at the new Magnolia Wedding Chapel. When you marry, your spouse's adopted children become yours too. Rent a city bike for $3, or buy one at the new Spoke and Pedal Bike Shop. The food court has 10 restaurants now. Explore new nature places: a wildflower meadow, a swamp boardwalk, a botanical garden with a butterfly house, Hawk Ridge Overlook, and Riverbend Nature Center. New jobs: wedding planner, event planner, and park ranger. Walk into players' shops at the Main Street Business Center, with clear steps to open your own. Bright Mobile sells cases, screen protectors, and chargers made for each phone.";
function defState(){return{cash:300,bank:2500,loan:0,hasID:false,license:false,huntLic:false,
 home:'studio',homes:['studio'],cars:[],car:null,carAt:'home',clothes:[],wearing:{},stuff:[],gear:{},armor:[],
 cooler:[],groceries:0,pantry:{eggs:2,bread:4,milk:2,cereal:2,soup:1},phone:null,ps:false,games:[],hiscore:{},appliances:[],appl:{lights:false,temp:72,tv:false,locked:true,blinds:false},
 pets:[],petSup:{},hunger:80,energy:90,health:100,drinks:0,drinkT:0,clubIn:false,clubStyle:'house',

let S;
function load(){try{const j=localStorage.getItem(SAVE);if(j){const d=defState(),o=JSON.parse(j);S=Object.assign(d,o);S.settings=Object.assign(defState().settings,o.settings||{});S.appl=Object.assign(defState().appl,o.appl||{});return}}catch(e){}S=defState()}
function petRemindList(){const out=[],now=Date.now();(S.pets||[]).forEach((p,i)=>{if(!p.born)return;const f=p.k==='dog'?'dogfood':'catfood';const fed=has('feeder')&&(S.petSup[f]||0)>0;const base=p.t||now,hz=base+(p.hunger/5)*36e5,st=(p.starve||0)*36e5;
  if(!fed){if(p.hunger>25)out.push({tag:'pet'+i+'a',at:base+((p.hunger-25)/5)*36e5,body:`${p.name} is getting hungry. Come home and feed ${p.name}.`});out.push({tag:'pet'+i+'b',at:Math.max(hz,now+12e4),body:`${p.name} is starving! Feed ${p.name} as soon as you can.`});
   if(S.settings.petDeath!==false){out.push({tag:'pet'+i+'c',at:hz+96*36e5-st,body:`${p.name} is very sick from hunger. Please feed ${p.name} today.`});out.push({tag:'pet'+i+'d',at:hz+150*36e5-st,body:`Last warning: ${p.name} will not make it without food very soon.`})}}
  if(S.settings.petDeath!==false)out.push({tag:'pet'+i+'e',at:p.born+(p.life-1)*PET_MO,body:`${p.name} is very old now and sleeps most of the day. Spend some time with ${p.name}.`})});
 return out.filter(r=>r.at>now+6e4&&r.at<now+30*864e5).map(r=>({...r,at:Math.round(r.at/6e4)*6e4,title:'Roamerica'})).slice(0,12)}
let REMIND_SENT='';

function save(){try{const h=clock().h;if(S&&S.started){if(h>=0&&h<4)S.nightOwl=true;if(h>=5&&h<7)S.earlyBird=true}}catch(e){}syncHome();checkAch();try{checkQuests()}catch(e){}S.cash=r2(S.cash);S.bank=r2(S.bank);S.loan=r2(S.loan);S.savedAt=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}try{cloudSaveSoon()}catch(e){}try{petRemindSync()}catch(e){}}

const live=$('#live'),alertR=$('#alert');

/* ================= AUDIO ENGINE (all sounds are generated live) ================= */
let AC=null,MASTER,SFX,AMB,WHITE,BROWN;
function initAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;let o0={};try{if(!S||!S.settings||S.settings.saver!==false)o0={latencyHint:'balanced'}}catch(e){}try{AC=new C(o0)}catch(e){AC=new C()}MASTER=AC.createGain();MASTER.connect(AC.destination);SFX=AC.createGain();SFX.connect(MASTER);AMB=AC.createGain();AMB.connect(MASTER);mkBufs();['ui-click','ui-ok','ui-error','step','door','carstart','page1','page2','siren','baby','fireworks','bowshot','xbowshot','arrowhit','gunshot','gobble','quack','snort','splash','sizzle','coffee','cheer','trainhorn','bark','smallbark','purr','meow','pant','whine','typing','boil','closetopen','closetclose','kidslaugh','kidsplay','jaildoor','keys','lockpick','coins','scan','horn','chirp','doorbell','engine0.wav'].forEach((n,i)=>{const go=()=>{try{loadReal(n)}catch(e){}};if(i<12)go();else setTimeout(go,(i-11)*200)})}
 if(AC.state!=='running')AC.resume();applyVol()}catch(e){}}
let WX=null,VOX=null;function buses(){if(!AC)return;if(!WX){WX=AC.createGain();WX.connect(MASTER)}if(!VOX){VOX=AC.createGain();VOX.connect(MASTER)}}
const lv=(k)=>{const v=S.settings[k];return v==null?1:v};
function applyVol(){if(!AC)return;buses();const st=S.settings;MASTER.gain.value=st.vol;AMB.gain.value=st.amb?0.55*lv('ambVol'):0;WX.gain.value=st.amb?lv('wxVol'):0;SFX.gain.value=lv('sfxVol');VOX.gain.value=lv('voxVol')}
function mkBufs(){const len=AC.sampleRate*2;WHITE=AC.createBuffer(1,len,AC.sampleRate);BROWN=AC.createBuffer(1,len,AC.sampleRate);const w=WHITE.getChannelData(0),b=BROWN.getChannelData(0);let last=0;
 for(let i=0;i<len;i++){const r=Math.random()*2-1;w[i]=r;last=(last+0.02*r)/1.02;b[i]=last*3.5}}
function src(brown){const s=AC.createBufferSource();s.buffer=brown?BROWN:WHITE;s.loop=true;return s}
const T=()=>AC.currentTime;
function out(pan,dest){dest=dest||SFX;if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(dest);return p}return dest}
function tone(f,dur,o={}){if(!AC)return;const t0=T()+(o.t||0),osc=AC.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t0);
 if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t0+(o.glide||dur));const g=AC.createGain(),v=o.vol==null?.25:o.vol,a=o.a==null?.005:o.a;
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.setValueAtTime(v,t0+Math.max(a,dur*(o.hold||0)));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 let n=osc;if(o.lp||o.bp){const fl=AC.createBiquadFilter();fl.type=o.lp?'lowpass':'bandpass';fl.frequency.value=o.lp||o.bp;fl.Q.value=o.q||1;osc.connect(fl);n=fl}
 n.connect(g);g.connect(out(o.pan,o.dest));osc.start(t0);osc.stop(t0+dur+.05)}
function nz(dur,o={}){if(!AC)return;const t0=T()+(o.t||0),s=src(o.brown),f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t0);
 if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);f.Q.value=o.q||1;const g=AC.createGain(),v=o.vol==null?.3:o.vol,a=o.a==null?.005:o.a;
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.setValueAtTime(v,t0+Math.max(a,dur*(o.hold||0)));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 s.connect(f);f.connect(g);g.connect(out(o.pan,o.dest));s.start(t0,Math.random()*1.5);s.stop(t0+dur+.05)}
function texture(dur,o={}){if(!AC)return()=>{};const t0=T()+(o.t||0),s=src(o.brown),f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.value=o.f||800;f.Q.value=o.q||1;

 if(o.lfoF){const l=AC.createOscillator();l.type=o.lfoT||'sine';l.frequency.value=o.lfoF;const lg=AC.createGain();lg.gain.value=vol*(o.lfoD||.5);l.connect(lg);lg.connect(g.gain);l.start(t0);nodes.push(l)}
 if(o.ffF){const l2=AC.createOscillator();l2.frequency.value=o.ffF;const lg2=AC.createGain();lg2.gain.value=o.ffD||200;l2.connect(lg2);lg2.connect(f.frequency);l2.start(t0);nodes.push(l2)}

 let done=false;const stop=(r=.4)=>{if(done)return;done=true;try{const t=T();e.gain.cancelScheduledValues(t);e.gain.setValueAtTime(Math.max(e.gain.value,.0001),t);e.gain.exponentialRampToValueAtTime(.0001,t+r);nodes.forEach(n=>{try{n.stop(t+r+.05)}catch(x){}})}catch(x){}};
 if(dur)setTimeout(()=>stop(.35),Math.max(0,(dur-.35)*1000+(o.t||0)*1000));return stop}
function hum(f,vol,o={}){if(!AC)return()=>{};const osc=AC.createOscillator();osc.type=o.type||'sawtooth';osc.frequency.value=f;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp||200;const g=AC.createGain();g.gain.value=vol;osc.connect(fl);fl.connect(g);g.connect(out(o.pan,o.dest||AMB));osc.start();return()=>{try{g.gain.setTargetAtTime(.0001,T(),.1);osc.stop(T()+.5)}catch(e){}}}
function distCurve(k){const n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}

const sfx={

function pay(amt){amt=r2(amt);if(S.cash>=amt){S.cash-=amt;return'cash'}if(S.bank>=amt){S.bank-=amt;return'your debit card'}if(S.cash+S.bank>=amt){S.bank-=amt-S.cash;S.cash=0;return'cash and your debit card'}return null}
function tryPay(amt,quiet){const how=pay(amt);if(!how){sfx.error();say(`You can't afford that. It costs ${money(amt)}. You have ${money(S.cash)} cash and ${money(S.bank)} in the bank.`);return false}if(!quiet)sfx.register();save();updHud();return how}

const dist=(a,b)=>{const A=PL[a],B_=PL[b];if(A.town===B_.town)return Math.abs(A.x-B_.x)+Math.abs(A.y-B_.y);const TA=TOWNS[A.town],TB=TOWNS[B_.town];return Math.abs(A.x)+Math.abs(A.y)+Math.abs(B_.x)+Math.abs(B_.y)+Math.abs(TA.rx-TB.rx)+Math.abs(TA.ry-TB.ry)};
const directRoute=(a,b)=>ROUTES.find(r=>r.stops.includes(a)&&r.stops.includes(b));
const FT_BLOCK=660;function feetText(n){const ft=Math.max(1,n)*FT_BLOCK;if(ft<2640)return`${(Math.round(ft/10)*10).toLocaleString('en-US')} feet`;const mi=ft/5280;return`${mi<10?mi.toFixed(1).replace(/\.0$/,''):Math.round(mi)} ${mi===1?'mile':'miles'}`}

  if(Math.random()<.4){const ev=pick([['A car cuts you off! What do you do?','Brake smoothly and give them space',['Honk and speed up','Swerve hard']],['You see a sign: Weigh station ahead. What do you do?','Pull in to get weighed',['Drive past it','Turn around']],['Heavy rain starts falling. What do you do?','Slow down and turn on your lights',['Speed up to get home','Turn on hazard lights and stop on the highway']],['Your sleepy eyes are getting heavy.','Pull over at a rest stop',['Drink more coffee and keep going','Roll down the window and keep driving']]]);

  S.bank+=pay;earned+=pay;loads++;S.job.shifts++;S.totalShifts=(S.totalShifts||0)+1;S.loadsHauled=(S.loadsHauled||0)+1;S.job.earned=r2((S.job.earned||0)+pay);S.energy=clamp(S.energy-10,0,100);S.hunger=clamp(S.hunger-8,0,100);let promo='';

async function pottyTrip(i){const p=S.pets[i];if(busy)return;if(p.k==='cat'&&!S.petSup.litter){sfx.error();say('You need a litter box from Happy Paws Pet Center.');return}busy=true;
 if(p.k==='dog'){sfx.door();say(`You clip on ${p.name}'s leash and step out to the grass.`);for(let k=0;k<6;k++){sfx.step(k%2?.2:-.2);await pause(420)}}else{say(`You carry ${p.name} to the litter box and set ${p.name} down gently.`);await pause(1500)}
 await pause(1500);busy=false;const ok=Math.random()<.55+(p.potty||0)/250+(p.mess?0:.1);
 if(!ok){p.potty=clamp((p.potty||0)+1,0,100);save();say(`${p.name} ${p.k==='dog'?'sniffs around the yard':'sniffs the litter'} but does not need to go right now. Try again later. Regular trips help ${p.name} learn.`);return}
 if(p.k==='dog')nz(2,{ft:'lowpass',f:900,vol:.08});else nz(1.2,{ft:'highpass',f:1800,vol:.12,lfoF:5});
 const was=p.potty||0;rewardScreen(i,p.k==='dog'?'went potty outside in the grass':'used the litter box',15,8,amt=>{p.potty=clamp(was+amt,0,100);if(was<100&&p.potty>=100){setTimeout(()=>{sfx.levelup();say(`${p.name} is fully potty trained! No more accidents.`)},2700)}})}
const TRICKS={dog:[['Sit','sits down'],['Stay','stays put while you walk away'],['Come','runs right to you'],['Lie down','lies down flat'],['Shake','lifts a paw to shake your hand'],['Roll over','rolls all the way over'],['Spin','spins in a circle'],['Speak','barks on cue']],cat:[['Come when called','trots over to you'],['Sit','sits down'],['High five','taps your hand with a paw'],['Spin','spins in a circle']]};
function trickScreen(i){const p=S.pets[i];cur=()=>trickScreen(i);screen(`Teach ${p.name} a trick`,()=>{P(`Pick a trick to practice. Each time ${p.name} gets it right, reward ${p.name} with a treat or praise. Treats teach fastest. Mistakes are okay: just try again.`,'tt');
 TRICKS[p.k].forEach(([t])=>{const v=p.tricks[t]||0;B(`${t}: ${v>=100?'learned':v?Math.round(v)+' percent learned':'not started'}`,()=>tryTrick(i,t),{k:'t:'+t})});B(`Back to ${p.name}`,()=>petScreen(i))},{focus:'#tt'})}
async function tryTrick(i,t){const p=S.pets[i];if(busy)return;busy=true;const v=p.tricks[t]||0,act=TRICKS[p.k].find(x=>x[0]===t)[1];say(`You say "${t}" and show ${p.name} what to do.`);await pause(2200);busy=false;
 if(p.hunger<15){sfx.error();say(`${p.name} is too hungry to focus. Feed ${p.name} first.`);return}
 const ok=Math.random()<.35+v/140+(p.happy>60?.1:0);
 if(!ok){p.tricks[t]=clamp(v+2,0,99);save();say(pick([`${p.name} tilts their head, not sure what you mean.`,`${p.name} gets distracted and looks away.`,`${p.name} almost does it, then gives up.`])+' Be patient and try again.');setTimeout(()=>trickScreen(i),2600);return}
 p.k==='dog'?sfx.bark(p.small):sfx.meow();rewardScreen(i,act,20,12,amt=>{p.tricks[t]=clamp(v+amt,0,100);S.petCare=(S.petCare||0)+1;if(v<100&&p.tricks[t]>=100)setTimeout(()=>{sfx.levelup();say(`${p.name} learned ${t}!`)},2700)})}
function showTrick(i){const p=S.pets[i];const tk=Object.keys(p.tricks).filter(t=>p.tricks[t]>=100);cur=()=>showTrick(i);screen(`${p.name}'s tricks`,()=>{P(`Ask ${p.name} to do a trick ${p.name} knows.`,'st2');tk.forEach(t=>B(t,()=>{const act=TRICKS[p.k].find(x=>x[0]===t)[1];p.happy=clamp(p.happy+5,0,100);save();if(t==='Speak')sfx.bark(p.small);else if(t==='Spin'||t==='Roll over')sfx.whoosh();else p.k==='dog'?sfx.pant():sfx.purr(1);say(`You say "${t}," and ${p.name} ${act}! Good ${p.k==='dog'?'dog':'kitty'}!`)},{k:'s:'+t}));B(`Back to ${p.name}`,()=>petScreen(i))},{focus:'#st2'})}

  ["What's new",()=>{P(WHATSNEW)}],
  ['Levels, skills, and unlocks',()=>{P(`You have a player level from 1 to ${MAXLV}. You earn points for almost everything you do: working, cooking, eating out, fishing, hunting, driving, walking, exploring, making friends, chatting, games, caring for pets and kids, achievements, and daily quests. Each new level gives you cash and every 5 levels gives you a new title, from Newcomer to Audio City Icon.`);P('You also have '+SKILLS.length+' skills that level up from 1 to '+SKMAX+': '+SKILLS.map(s=>s[1]).join(', ')+'.');P('Unlocks: '+PERKS.map(p=>`level ${p[0]}, ${p[1]}`).join('; ')+'. Level experiences happen at the Skyline Rewards Club downtown. Check your level any time with My level and skills in the menu.')}],
  ['Chat, voice chat, texts, and notifications',()=>{P('You can turn on notifications from the start screen before you create your character or restore your game. They start working as soon as your character is ready. If notifications will not turn on, the game tells you why. Most often on iPhone: open the game from its Home Screen icon, not from Safari, and in the iPhone Settings app go to Notifications, then Audio City, and turn on Allow Notifications.');P('Messages can be up to 5,000 characters, with line breaks. Web links in messages can be tapped to open them. Choose any message from another player to reply, react, add them as a friend, or text them.');P('Player chat shows messages like a text conversation, oldest first. Type a message and choose Send, or choose Record a voice message: wait for the beep, talk, choose Stop recording, listen if you want, then Send it.');P('Live voice chat: in Player chat, choose Turn on voice chat and my microphone. Players at the same place as you who also have voice chat on can hear each other out loud, and so can friends on a phone call. Use Mute my microphone when you need to. Headphones help stop echo.');P('Texts wait for friends who are offline. Buy a phone at the mall to text and call friends.');P('Notifications: turn them on in Settings or Player chat to hear about texts, voice messages, calls, job offers, and player chat while you are away, even when the game is closed. You can turn each kind on or off in Settings. On iPhone and iPad, notifications only work when you open the game from your Home Screen: in Safari choose Share, then Add to Home Screen. The Home Screen keeps its own save, so restore your game with your backup PIN the first time.')}],
  ['Sound and volume',()=>{P('Announcer voice: a real recorded announcer says things like Correct, Level up, Congratulations, and Game over. In Settings, under Announcer voice, choose a woman, a man, or off.');P('In Settings, under Sound, you can change the overall volume and turn background sounds on or off. You can also make each kind of sound louder or quieter by itself: background sounds like crowds and traffic, weather sounds like rain, wind, and thunder, sound effects like footsteps and doors, and voices like the announcer and voice messages. Turn any of them all the way down to mute it.');P('Weather sounds covers all the rain in the game: rain and thunder outside, rain on your windows at home, and rain on your car roof while you drive. Turn Weather sounds all the way down to make the rain silent.')}],
  ['Private messages',()=>{P('Player chat has two tabs at the top: Public chat and Private messages. Double tap a tab to switch. Public chat is seen by everyone nearby, or everywhere if Hear chat from everywhere is on. Private messages are only seen by you and the other player, and you do not need a phone.');P('To start one, open the Private messages tab and choose a player who is online, or type their username and choose Open. You can also choose any message in Public chat and pick Send a private message. Private messages wait for players who are offline, the tab tells you how many are new, and you get a notification when you are away.')}],
  ['Playing together: visits, gifts, and meet-ups',()=>{P('Add other players as friends in Player chat. Then open your friends list and choose a friend to hang out.');P('Go to where your friend is: if they are online, travel straight to the place they are at. Invite them to meet you: they get an invite, and Meet-up invites shows up in their menu with a button to come to you. Visit their home: hear about their home, pets, kids, and furniture, ring the doorbell so they know you stopped by, pet their pet, sign their guest book, or leave a gift. Send a gift: flowers, chocolates, a teddy bear, a birthday cake, pizza, a balloon, a pet toy, a candle, or a gift card. Gifts arrive right away, or the next time they play.')}],
  ['Chat: newest messages first, and opening from notifications',()=>{P('When you open Player chat, Private messages, or your texts, you land right on the message box, ready to type. The newest messages are right above it. Swipe left from the message box to hear the newest message first, then keep swiping left for older ones.');P('Only the newest 15 messages show at first, so the screen is not crowded. To hear older ones, find the button that says Show older messages, with how many more there are. It is right above the messages. Double-tap it to add 15 older messages each time.');P('Everything else in Player chat, like who is nearby, voice chat, notification settings, and the players online list, is now below the message box and the Record a voice message button.');P('When you tap a notification for a chat message, a mention, a text, or a private message, the game opens to that conversation. If the game was closed, the start screen shows a button first, called Open, then the conversation name, from your notification. Double-tap it to go straight there.')}],
  ['How chat stays up to date',()=>{P('Chat now runs on a faster, free live connection. New chat messages, texts, and private messages usually show up within a second or two. If the live connection drops, the game switches back to checking every few seconds on its own, so you never miss anything. Players still on the old link can chat with you too, though their messages may take up to about 20 seconds to arrive.');P('While Player chat, Private messages, your texts, or a call is open, the game checks for new messages every few seconds. On other screens it checks about every 30 seconds, and every minute and a half if you have not touched anything for 10 minutes. As soon as you tap, swipe, or type again, it checks right away.');P('When the game is in the background or your phone is locked, it checks for a few minutes, then stops to save battery and data. Turn on notifications in Settings so you still hear about texts, calls, and messages while you are away. When you come back to the game, it catches up right away, so you do not miss anything.')}],
  ['Going back',()=>{P('Player chat, Private messages, your texts, and your friends list are on the start screen too, so you can check messages without going into the game. Settings and the How-to guide are also on the start screen, so you can change your sound, volume, voices, and notifications before you even start playing. Every screen has a Back button right at the top, under the heading. It says where it goes, like Back to Settings and help. With VoiceOver on iPhone or iPad, you can also do the two-finger scrub, a quick Z shape with two fingers, to go back. On a computer, press the Escape key. On Android, use the back button or gesture.')}],
  ['Driving: self-driving and lane assist',()=>{P('When you drive your car, choose Drive with self-driving to sit back while the car steers, signals, stops at red lights, and takes the exits for you. Or choose Drive it yourself, with lane assist. The game reads each direction, and you choose Go straight, Turn left, Turn right, Merge onto the highway, Take the exit, or Pull in on the right or left. You hear the turn signal when you turn. If you drift, lane assist beeps on that side. Choose Steer left or Steer right, or lane assist steers you back by itself. You can switch to self-driving any time. Taxis, buses, trucks, and taxi driving shifts all have the full driving sounds too.')}],
  ['Combo meals',()=>{P('At restaurants and fast food places, choose Make a combo meal. Pick a main, then a side like fries or onion rings, then a drink, then a dessert like apple pie or a sundae. You can skip any of them. A combo is 10 percent off, and it fills you up more. Drive-thrus have combo meals too.')}],
  ['Switching jobs and trucking',()=>{P('You can switch jobs any time. Go to the Job Center in any town, or use the Jobs app on your phone, and apply for a different job. Every job in every town is listed there. If you go back to a job you had before, you keep the rank you earned.');P('Trucking: get your regular driver\'s license, then take the CDL test at the DMV. Apply for Truck Driver at Big Rig Freight Yard. Choose Start a trucking shift, take loads to places in all five towns, and get paid. Fill up with diesel at the Big Rig Truck Stop, pull in at weigh stations, and sleep in your sleeper cab on long hauls. At the top rank, buy your own truck to earn 50 percent more, and hire up to 3 drivers who earn you money every hour.')}],
  ['Replying, reactions, and mentions',()=>{P('In Player chat and in your texts, every message from another player is a button. Choose it to reply, react, add that player as a friend, text them, or play their voice message. Reactions are love, like, haha, wow, sad, and praying, and the other player hears your reaction. When you reply, the game puts an at sign and their username at the start of your message, like @Ben, so they know it is for them.');P('When someone mentions you with your username, you hear a text sound and the game reads it to you, even if you are in another town. If notifications are on, you get one for mentions too.')}],
  ['Banking, credit cards, and savings',()=>{P('At First Carolina Bank you can get a photo ID, take out a loan, apply for a credit card, upgrade to a Rewards Debit Card with 1 percent cash back, open a savings account that earns interest every day, and report a lost card. The bank app on your phone lets you check balances, pay your credit card, move money to savings, and send money to friends.');P('Your credit score starts at 650. Pay your credit card at least the minimum every week to raise it. Late payments cost $35 and lower your score. Better scores unlock better cards: Starter at 580, Gold at 680 with 1 percent cash back, and Platinum at 750 with 2 percent cash back. If you don\'t have enough cash or money in the bank, stores charge your credit card.')}],
  ['24-hour food, drive-thrus, and health',()=>{P('Fast food open 24 hours: '+['cluck','tacorocket','pizza24','allnight','burger','harbor_shrimp','pine_burger','maple_donut','river_subs'].filter(id=>PL[id]).map(id=>PL[id].name).join(', ')+'. Walk in and order from the menu, or drive your car there and choose Use the drive-thru.');P('Check your hunger, energy, and health from any screen with Check my hunger, energy, and health in the menu. Every town has an urgent care and family doctor, plus a pharmacy. Carolina Family Doctors in Audio City does checkups and flu shots.')}],
  ['Missions',()=>{P(`There are ${MISSIONS.length} story missions, found in Missions in the menu at the bottom of every screen. Each one sends you to several places in order. You can walk, drive, or ride the bus to each stop, and the story continues when you arrive. Finish a mission to earn a cash reward. Some missions travel across all five towns.`)}],
  ['Getting started',()=>{P('When you start, you create a character with a username, a hairstyle, and an outfit. You begin in a rented studio on Main Street with $300 cash and $2,500 in the bank.');P('Every screen has a heading with the place name, a line with the time and your money, the things you can do there, and a Menu section at the bottom. The menu has Go somewhere, Go home, Daily quests, Check my status, My stuff, and Settings and help. Chat with players and My phone show up there too when you have them.');P('Good first steps: get a photo ID at First Carolina Bank, apply for a job at the City Job Center, then get your driver\'s license at the DMV.')}],
  ['Getting around',()=>{P('Choose Go somewhere and pick a place. Then choose how to get there: auto-walk, walk it yourself with turn-by-turn directions, drive your car, call a taxi, or ride a city bus. Every bus route stops at Central Bus Station.');P('Beacon: when you walk yourself to a destination, a ping plays through your headphones. It sounds high and centered when you face your destination. It comes from your left or right when you should turn, and sounds low and muffled when the destination is behind you. It speeds up as you get closer. Sighted players see a compass arrow pointing the way, the distance, and a red circle on the map around the destination. You can turn the beacon on or off on the walking screen.');P('While you walk yourself, each town sounds different under your feet: concrete sidewalks in Audio City and Riverton, wooden boardwalks in Harbor Bay, gravel trails in Pinewood, and dirt roads in Maple Falls. Buildings make a sound as you get close, like clinking dishes for restaurants, a door chime for stores, birds for parks, and a bell for churches. Sounds from your left or right tell you which side a place is on. The game tells you what is one block ahead, to your left, and to your right, and announces when you arrive.');P('Walking yourself: choose Walk forward one block, Turn left, Turn right, or Turn around. Where am I tells you your corner, and Repeat directions tells you the next turn. When you arrive, choose Go inside. Walk yourself to find 12 golden coins hidden on street corners. The radio station and the library give hints.');P('There are five towns: Audio City, Harbor Bay, Pinewood, Maple Falls, and Riverton. Each has its own streets, stores, restaurants, homes, and bus routes. Drive, take a taxi, or ride the Intercity Express between towns. Every town has a bus station. Go somewhere lists the places in your town first, then the other towns.');P(`The city has ${STREETS.length} named streets, like ${STREETS.slice(5,10).join(', ')}, plus numbered avenues east and west of Center Avenue.`)}],
  ['Money, jobs, and careers',()=>{P(`Jobs: ${Object.values(JOBS).map(j=>j.n).join('; ')}. Work shifts to get promoted and earn more. Classes at the community college raise your pay at every job.`);P(`Businesses at City Hall earn money every real hour: ${BIZ.map(b=>b.n).join(', ')}. You can also earn money by fishing and hunting, then selling your catch at Harbor Fish and Game Market.`);P('First Carolina Bank has a 24-hour ATM, photo IDs, and loans. Daily quests pay $300 each, and the daily reward grows for 30 days in a row.')}],
  ['Stores and shopping',()=>{P(`The mall has ${MALL.length} stores: ${MALL.map(m=>m.name+', '+m.blurb).join('; ')}. It also has a food court.`);P('Clothes come in real colors and sizes. You can try them on, then wear them from your closet at home. Other stores around the city: '+Object.keys(PL).filter(id=>PL[id].cat==='Shopping'&&id!=='mall').map(id=>PL[id].name).join(', ')+'.')}],
  ['Food and the kitchen',()=>{P('Restaurants: '+Object.keys(PL).filter(id=>RESTS[id]).map(id=>PL[id].name).join(', ')+'.');P(`At home, open the fridge to hear what food you have, then cook one of ${RECIPES.length} meals and snacks. You can cook your own fish and game too, and extra servings become leftovers. Buy groceries and snacks at FreshMart, MegaMart, the fish market, or the Saturday farmers market. Keep your hunger up, or you'll get tired and your stomach will growl.`)}],
  ['Your home',()=>{P(`There are ${Object.keys(HOMES).length-1} homes on different streets, from a $26,000 mobile home to a mansion. Houses are sold at Hometown Realty. Apartment buildings have leasing offices: Oak Hollow, the cheapest, Sunrise Village, Parkview Lofts, Highland Towers, and Riverside. You can pay cash, get a mortgage, or rent an apartment by the month. Rent comes out of your bank every 30 real days, and you can end a lease in Settings.`);P('At home you can cook, sleep to restore energy, get dressed, play PlayStation, care for your pets, visit your garage, and use smart home devices. Smart Living in the mall sells '+APPL.length+' smart devices. With a smart speaker, type or dictate commands like lights on, make coffee, or play music.')}],
  ['Cars, gas, and driving',()=>{P('Ran out of gas? Walk or take a taxi to QuickFuel Gas Station and choose Buy a gas can. Go back to your car and choose Pour your gas can into your car. Then drive to QuickFuel and fill up. You can refill the gas can at QuickFuel too.');P(`Carolina Motors sells ${CARS.length} vehicles, each with its own engine sound: ${CARS.map(c=>c.n).join('; ')}. You need a driver\'s license to drive.`);P('Your car uses fuel and wears down as you drive. Fill up or charge at QuickFuel, and get repairs and upgrades at Ace Auto Repair. The City Parking Garage rents cars by the day. Your car stays wherever you parked it, so remember where you left it. Never drive after drinking.')}],
  ['Pets',()=>{P(`Adopt a dog or a cat at Happy Paws Pet Center or Second Chance Animal Shelter. There are ${PETS.length} breeds. Feed your pets, give them water and treats, play with them, and cuddle them at home. Walk your dog at Central Park. Pets get hungry over real time, so check on them every day.`)}],
  ['Fun and things to do',()=>{P('Places for fun: '+Object.keys(PL).filter(id=>PL[id].cat==='Fun and fitness').map(id=>PL[id].name).join(', ')+', plus Neon Pulse Nightclub, Mic Drop Karaoke Bar, Crossroads Mall, and the airport for trips.');P('Games with left and right sounds: hunting, PlayStation games, go-karts, and the escape room. Wear headphones, or turn on direction announcements in Settings. Turn on Extra time in Settings if timed games feel too fast.');P('Town Square has a seasonal festival that changes with the real date, plus townspeople to talk to.')}],
  ['Outdoors',()=>{P('Camp at Pine Ridge State Park: build a campfire, roast s\'mores, and sleep in a tent. At home, plant seeds from the hardware store in your garden. They grow in real time, and watering helps. Buy a bike at MegaMart to ride anywhere, twice as fast as walking. Every Saturday, catch a fish of 10 pounds or more at Willow Lake to win the $500 tournament prize.');P('Outdoors: '+Object.keys(PL).filter(id=>PL[id].cat==='Outdoors').map(id=>PL[id].name).join(', ')+'. Fish at Willow Lake or off Riverside Bridge. Hunt at Pine Ridge with a license, a rifle, and ammunition from Bait and Tackle Outfitters. Armor from Iron Guard protects you from wild boars.');P('The weather changes every few hours and follows the four seasons. See Weather and seasons in this guide for more.')}],
  ['Time and store hours',()=>{P('The game follows the real local time for your time zone, which you can change in Settings, including daylight saving time. Stores open and close at real times, the nightclub is open at night, and the farmers market is only open Saturday mornings. Turn on Practice mode in Settings to ignore store hours.')}],
  ['Playing with sighted friends',()=>{P('Sighted players also see a moving map with roads, stoplights, the interstate, houses, and the homes you own marked YOURS; a picture of the sky, weather, and the place on every screen; pictures of you driving, walking, cooking, eating, and sleeping; and colored bars for hunger, energy, and health.');P('Sighted players see everything on screen: a city map at the top of each place with a yellow ring showing where you are, an icon for every place, a message bar at the bottom showing the latest announcement, and big LEFT and RIGHT arrows during games. VoiceOver users don\'t hear any of these extras, so nothing changes for them.')}],
  ['Saving your game',()=>{P('If your online backup is off, the game asks you to turn it on when you create your character, and again every couple of days when you open the game. Choose Not now to skip it. Backup is your choice: in Settings, under Backup, you can turn backup on or off, and turn these reminders off.');P('Back up your game online: go to Settings, then Backup, and choose a PIN. Your game then backs up by itself. On a new phone, a new browser, the Home Screen, or the new game link, choose Restore my game from an online backup on the title screen and type your username and PIN. Your friends, money, home, pets, job, and level all come with you.');P('Your game saves on this device automatically. Save codes in Settings move your game to another phone or browser.')}],
  ['Every place, town by town',()=>{Object.keys(TOWNS).forEach(t=>{H2(TOWNS[t].n);CATS.forEach(c=>{const ids=Object.keys(PL).filter(id=>PL[id].cat===c&&PL[id].town===t&&id!=='street');if(ids.length){H2(c);ids.forEach(id=>P(`${placeName(id)}, ${addr(id)}. ${PL[id].hours?hoursText(PL[id]):'Always open.'}`))}})})}],
  ['The new game link',()=>{P('Roamerica has moved to a new home: https://audio-city-life.audiocitylife.workers.dev. Your game, friends, and chat all work there.');P('If you play on the play link, the game moves you to the new link by itself the next time you open it, and your game comes with you.');P('If you play on the old link, audio-city-life.netlify.app, open the new link in Safari and choose Restore my game from an online backup on the title screen. Type your username and PIN.');P('Then add the new link to your Home Screen: in Safari, tap Share, then Add to Home Screen. Open the game from the new icon, go to Settings, and turn notifications back on. You can delete the old game icon from your Home Screen.')}],
  ['Pets: age, training, and saying goodbye',()=>{P('Pets grow up one month for every real day. Open Take care of your pets at home to hear each pet\'s age, and whether they are a puppy or kitten, an adult, or a senior.');P('Potty training: puppies and kittens start out not potty trained, and may have accidents on the floor. Choose Take your dog outside to go potty, or Show your cat the litter box. When your pet goes in the right place, reward them right away. A treat teaches fastest, praise works too, and doing nothing teaches very little. If there is an accident, choose Clean up the accident and keep practicing.');P('Tricks: choose Teach a trick and pick one, like Sit, Stay, Shake, Roll over, or High five for cats. Each time your pet gets it right, reward them. Mistakes are fine, just try again. Once a trick is learned, choose Ask your pet to do a trick to show it off. Pets that are too hungry cannot focus on training.');P('Saying goodbye: pets can pass away from old age, after a long life. They can also pass away if they go a whole week without food. You will hear a warning when a pet is hungry or starving. A smart pet feeder from Smart Living feeds your pets on its own while you are away, as long as you have pet food. Pets who have passed away are remembered under In loving memory on your pets screen. To turn this off, go to Settings, then Pets.')}],
  ['Using your things and playing music',()=>{P('Open My stuff from the menu. Under Use your things, choose anything you bought to use it. A Bluetooth or portable speaker plays music at home: pick a radio station, and it stops when you leave home. Earbuds, headphones, and headsets play music anywhere. Instruments like the guitar, keyboard, ukulele, violin, flute, harmonica, and drum set play a song. A microphone lets you sing.');P('Books, the Bible, and the e-reader let you read or listen. Toys, sports gear, crafts, and self-care things like bath bombs and face masks all do something, and some help your energy or health. Bath bombs, paint, and firewood get used up. Phone cases, screen protectors, chargers, and phone mounts go on your phone, so you need a phone first.')}],
  ['Hosting parties',()=>{P('At home, choose Host a party. Choose Make your own party to type your own party name and a description, like what to wear or what you will do. Your guests hear both. Or pick a birthday party, dance party, game night, pizza party, movie night, holiday party, or pool party. Party food and supplies cost $40, and the party lasts 3 hours.');P('Friends who are online get an invite in Meet-up invites. Any friend can join by choosing Visit their home from your friends list, then Join the party. You hear when someone arrives.');P('At a party you can dance, eat, play party games, take a group photo, and more. Birthday parties have cake, and movie nights have popcorn. Balloons, a speaker for music, a board game, or a microphone in your stuff make your party better. Choose End the party when you are done.')}],
  ['Pet reminders and starting over',()=>{P('Pet reminders: turn on notifications in Settings, then make sure Pet reminders is on. You get a notification when a pet is getting hungry, when they are starving, and when a pet is very old, even when the game is closed. A smart pet feeder with pet food means fewer hunger reminders. Pet reminders work on the new game link.');P('Starting over: in Settings, under Your character, choose Start over. You keep your username, your look, your friends, your texts, and your settings. Everything else goes back to the beginning, and your online backup is replaced with your new game. This cannot be undone.')}],
  ['Nearby players and giving rides',()=>{P('When other players are at the same place as you, you hear them come and go. You hear their car pull up and the door shut, their bike bell, or their footsteps, and the game says who it is. When someone at your place drives away, you hear them start the car and leave. To turn this off, go to Settings, then Other players.');P('Giving a ride: when another player is at the same place as you and your car is there too, open Players here with you from the menu and choose Offer a ride. They hear the offer and choose Ride offer in their menu, then Get in. Then choose Go somewhere and drive, and they ride along and arrive with you.');P('Taxi rides: if your job is taxi driver, your offer is a taxi ride, and your passenger pays you the taxi fare when you arrive. It goes into your bank account. Passengers can choose Get out of the car in the menu any time before you leave.')}],
  ['Love: dating, engagement, and marriage',()=>{P('First, add the player as a friend. Open Player chat and friends, then My friends list, then their name. Under Love and relationship, choose Ask them out on a date. The first time, you pick what you want to be called: boyfriend, fiancé, and husband; girlfriend, fiancée, and wife; or partner, fiancé, and spouse. You can change it in Settings, under Love and relationships. Anyone can date and marry anyone.');P('The other player gets a love request, even if they are offline. They choose Love requests in the menu, then Yes or No, thank you. When they say yes, you are dating. Your partner shows up in the menu on every screen.');P('Go on dates: on your partner\'s friend page, choose Go on a date with them. Pick dinner, a movie, a walk in the park, a picnic, dancing, a sunset hike, or ice cream. They hear about it too.');P('Getting engaged: on your partner\'s friend page, choose Propose, then pick a ring. When they say yes, you are engaged. Getting married: go to Magnolia Wedding Chapel and choose Plan your wedding. Pick a small chapel wedding, a garden wedding, or a grand ballroom wedding. Your partner gets the invitation and chooses Say I do. Then you hear your wedding, and you are married!');P('Family: when you get married, children your spouse adopted become your children too, and you become theirs. Children either of you adopt after the wedding are shared. Take care of them at home. To end a relationship, choose Break up or Divorce on their friend page. Children go back to the parent who adopted them.')}],
  ['Bikes: buy one or rent one',()=>{P('Buy a bike at Spoke and Pedal Bike Shop: a beach cruiser, mountain bike, road racing bike, electric bike, or tandem bike, plus helmets and bells. MegaMart sells bikes too. Then choose Go somewhere, pick a place in the same town, and choose Ride your bike.');P('Don\'t own a bike? Rent a city bike for $3. Choose Go somewhere, pick a place in the same town, then choose Rent a city bike from the bike share dock. You unlock it, ride there, and drop it off at the dock. Bikes are twice as fast as walking.')}],
  ['Nature places',()=>{P('New places to explore outdoors: Wildflower Meadow Nature Preserve, with a trail, beehives, and wildflowers to pick; Cypress Swamp Boardwalk, with frogs, turtles, alligators, and canoes; Magnolia Botanical Garden and Butterfly House, with roses, koi, a greenhouse, and a butterfly house; Hawk Ridge Overlook, a steep hike with a view of the city; and Riverbend Nature Center, with an owl rescue, turtles, and ranger walks. Each one has real nature sounds that change with the time of day, the weather, and the seasons. Find them with Go somewhere.')}],
  ['The food court',()=>{P('The Crossroads Mall Food Court now has '+FC_IDS.length+' restaurants: Mall Classics, Wok This Way for Chinese food, Taco Loco for Mexican food, Pita Palace for Mediterranean food, Bayou Cajun Kitchen, Burger Bites, Tokyo Teriyaki Grill, Green Leaf Salads, Top Dog, and Sweet Treats Cookie Company. At the mall, choose Food court, then pick a restaurant to see its menu.')}],
  ['Main Street Business Center: shops',()=>{P('Go to the Main Street Business Center with Go somewhere. You walk into a hallway of shops. Under Walk into a shop, choose a shop to go inside. You hear what it sells and who owns it, and you can buy things. The owner earns money from everything you buy, and what you buy goes in My stuff.');P('To get your own shop: under Get your own shop, pick a kind of shop, type a name, and pay $2,500. Your shop opens right away. Then choose Go inside your shop to run it for a shift, hire employees, upgrade it, and invite friends to work for you.')}],
  ['Phone cases, screen protectors, and chargers',()=>{P('At Bright Mobile in Crossroads Mall, each phone has its own heading with cases, screen protectors, chargers, wireless charging pads, and battery packs made to fit it. If you already have a phone, the store tells you which heading is yours. To put something on your phone, open My stuff and choose Use on it. If it is made for a different phone, the game tells you it won\'t fit.')}],
  ['New jobs: weddings, events, and nature',()=>{P('Wedding Planner at Magnolia Wedding Chapel, Event Planner at Spotlight Event Planning, and Park Ranger at Riverbend Nature Center. Apply at the City Job Center or with the Jobs app on your phone. Then go to your workplace and choose Start your shift. Each shift has 5 questions about the job.')}],
  ['Voice chat anywhere',()=>{P('Talk out loud with other players from anywhere in the game. Choose Turn on voice chat and talk out loud in the menu at the bottom of any screen, or in Player chat. Allow the microphone when asked.');P('Choose who you talk with: Nearby, for players at the same place as you, or Everyone, for every player online who also chose Everyone, wherever they are. Change it with the button Who you talk with on voice chat, in Player chat or in Settings, under Voice chat. Players at the same place as you and friends on a phone call can always hear you while voice chat is on.');P('Mute my microphone is right in the menu while voice chat is on. Turn voice chat off from the same menu button. Player chat tells you who has voice chat on, and who is talking with everyone. Headphones help stop echo. Everyone mode connects up to 15 players at once.')}],
  ['Tips as you play',()=>{P('The first time you get or do something, like buying your first car, getting a phone, adopting a pet, getting a job, or meeting another player, the game tells you a tip with the steps for what to do next. Tips start with the word Tip, and you hear a short chime first. For example, when you get a car, the tip tells you how to drive, how to get gas, and how to give other players a ride.');P('Every job has its own tip with the steps for doing that job. The first time you go to any place, a tip tells you what you can do there.');P('Tips wait until you stop typing and are not in the middle of something. To hear any tip again, go to Settings, then Tips, then Hear all the tips. You will also find tips you have not gotten yet, so you can learn about things before you do them. In Settings, under Tips, the Tips button has three choices. Double-tap it to switch between them: on the first time you do something, which is the normal setting; on all the time, so you hear the steps every time you go to a place, and the steps for your job every time you get to work; or off.')}],
  ['Whose home is it',()=>{P('When you get home, the game tells you whether you own your home or rent it. When you look at a home for sale or rent, and when you are at home, you hear which other players live in that kind of home and whether they own it or rent it.');P('When you visit a friend\'s home, the game tells you it belongs to them and whether they own it or rent it. When your car is parked at a place, the game tells you when you get there.')}],
  ['Weather and seasons',()=>{P('The city has four seasons that follow the real calendar: winter in December, January, and February, spring in March, April, and May, summer in June, July, and August, and fall in September, October, and November.');P('The weather can change every 4 hours, at midnight, 4 AM, 8 AM, noon, 4 PM, and 8 PM, and everyone has the same weather at the same time. When it changes, the game tells you, and the sounds outside change too.');P('What you hear: birds singing on clear, sunny days in spring, summer, and fall, and crickets at night. In rain and storms the birds go quiet and you hear rain, and thunder in a storm. Winter brings snow, freezing rain, cold wind, and sometimes thundersnow, which is thunder during a snowstorm. On windy fall days you hear leaves blowing.');P('To check the weather, open your phone and choose Weather app. It tells you the season, the weather right now, the temperature, and when it might change next. The weather sounds have their own volume in Settings, called Weather sounds.')}],
  ['All 50 states and flying',()=>{P('Roamerica has a town in every state. Audio City, Maple Falls, Harbor Bay, Pinewood, Riverton, and Bluegrass Hollow are still here, and every other state has a real city, placed where it really is on the map. Miles between towns are real.');P('To go to another state, choose Go somewhere. Other towns are listed at the bottom, grouped by part of the country, like The Gulf Coast, New England, The Great Lakes, and The West Coast. Each one tells you its state and how many miles away it is. Choose a town, then a place there.');P('Ways to travel: drive your car, call a taxi, ride an Interstate Coach bus from a bus station, take the train from a train depot, or take a flight. For trips of 250 miles or more, a Take a flight button appears. You need a photo ID to fly. Hawaii is across the ocean, so you can only get there by plane.');P('Every new town has a bus station, a train depot, a hometown diner with a state favorite food, a famous place to visit, a job you can only get there, and a realty office with an apartment to rent and houses to buy. Find every state job in the Jobs app on your phone.');P('Weather fits each place. Hawaii and Florida stay warm, the desert stays dry, Seattle and Portland, Oregon get lots of rain, and Alaska and the far north get snow in winter. Seasons follow the real calendar and change on the real first day of each season, like winter starting on December 21.')}],
  ['Live weather, time zones, and your starting state',()=>{P('The weather in every town is the real, live weather happening in that real place right now. The top of every screen says the weather and temperature where you are, and tomorrow\'s forecast with the high and low. For the full report, open your phone and choose Weather app. When the real weather changes, the game tells you, and the sounds change too, like rain or wind.');P('Every state has its real time zone. If the town you are in has a different time zone than your clock, the top of the screen tells you the time there too. To make the game clock follow each town, go to Settings, then Time zone, then choose Follow the real time zone of the town I am in. To go back to your own time, pick your time zone or Automatic.');P('Every state town has a mall with 10 stores, a hometown market for groceries, and two gas stations: a QuickFuel on Main Street and an Interstate Travel Center by the highway. Pump gas or charge your car there, buy a gas can, or shop in the store.');P('When you make a new character, or start over in Settings, you pick where to live. First pick a part of the country, then pick your town. You get a small rented studio on Main Street there. Or stay in Audio City, North Carolina, where the game began. You can travel anywhere later.')}],
  ['Horseback riding and feed stores',()=>{P('Every state town has Riding Stables, and so does Audio City. In Kentucky, the horses are at Twin Oaks Horse Farm. To get there, choose Go somewhere, then look under Outdoors.');P('Step 1: at the stables, pick a horse. Each stable has three horses with their own names. Step 2: bond with your horse. Pet and talk softly, brush, pick out the hooves, and give carrots. Step 3: choose Go on a trail ride, $35. You hear the hooves on the trail. Two times on the ride, you choose to keep walking, trot, or gallop.');P('Every time you care for or ride a horse, you bond a little more. You go from just meeting, to getting to know each other, to good friends, to best buddies. You can also take a riding lesson to learn how to sit, steer, and stop.');P('Carrots: buy a bag of 10 for $5 at any Feed and Farm Supply store, or at the Farmers Co-op in Maple Falls. If you have none, the stable sells one for $1. The feed store also has seeds for your garden, cowboy boots, hats, gloves, a riding helmet, a horse brush set, and chicken feed.')}],
  ['Personal care and your bathroom',()=>{P('At home, scroll down to the Bathroom heading. Step 1: brush your teeth. Step 2: floss. Step 3: wash your face. Step 4: brush your hair. Step 5: take a shower. Step 6: put on deodorant. You can also put on body lotion. The game tells you how many things you have left to do today, and when you finish the whole routine, you get a little health and energy boost.');P('Each thing uses up supplies, like toothpaste or shampoo. You start with some. To buy more, go to any pharmacy or grocery store and find the Personal care aisle. Each button tells you how many uses you have left. At home, choose What personal care supplies do I have to hear everything you have.')}],
  ['Battery saver',()=>{P('Battery saver keeps your phone from getting hot and helps your battery last longer. It is on unless you turn it off. In Settings, under Battery and heat, double tap Battery saver to turn it on or off.');P('With battery saver on, the game pauses all its sounds a few seconds after you leave the game or lock your screen, and starts them again when you come back. Sounds keep going if you are on a call, in voice chat, or listening to the radio.');P('If you do not tap anything for 10 minutes, the background sounds rest. New messages still make their sound. Tap anywhere and the background sounds come right back.');P('Battery saver also turns off moving pictures, like the car driving on the road. If you want sounds to keep playing while the game is in the background, turn on Keep sounds playing when the game is in the background. That uses more battery.')}],['Answering calls and easy steps',()=>{P('When another player calls you, your phone rings and an Answer button pops up at the top of whatever screen you are on. Step 1: swipe to the Answer button. VoiceOver usually puts you right on it. Step 2: double tap it. You are on the call. To say no, double tap Decline instead.');P('If you do not answer in about 30 seconds, it becomes a missed call. To call back, open your phone, choose Friends: call and text, pick your friend, then choose Call.');P('On a call: double tap Turn on live voice and my microphone to talk out loud, or type in the text box and double tap Say it. Double tap Hang up when you are done.');P('When you get a text, a Reply button pops up at the top of the screen. Double tap it to open the conversation, already on the text box. Type your reply, then double tap the button right after the box. Choose Later to hide it.');P('The phone, call, text, friends, chat, bank, ride, food delivery, and jobs screens have a short Steps paragraph at the top that tells you what to do. To turn these off, go to Settings, then Step-by-step help.')}],['States, distances, and Bluegrass Hollow',()=>{P('Every town is in a state. Audio City and Maple Falls are in North Carolina. Harbor Bay is in South Carolina. Pinewood is in Tennessee. Riverton is in Georgia. Bluegrass Hollow is in Kentucky. When you choose Go somewhere, other towns tell you their state and how many miles away they are. When you drive to another state, you hear when you cross the state line.');P('Distances are now in feet and miles. One block is 660 feet, and 8 blocks make a mile. Directions tell you how far to go on each street. When you walk, you hear how many feet you have left.');P('Bluegrass Hollow, Kentucky is horse country. Ride a horse and visit the foals at Twin Oaks Horse Farm, watch a race at Bluegrass Downs, take the lantern tour at Hollow Cave Tours, shop the Courthouse Square Farmers Market and the Hollow General Store, canoe at Cave Spring Lake, and eat a Hot Brown at the Hollow Hearth Diner. Get there by car, taxi, the Intercity Express bus, or the train.');P('New jobs: horse groom, general store clerk, farmers market seller, sawmill worker, vet assistant, cave tour guide, and racetrack usher in Bluegrass Hollow, plus apple picker at Apple Ridge Orchard, mountain trail guide in Pinewood, and lighthouse keeper in Harbor Bay. Find them in the Jobs app on your phone.')}],
  ['Replying from a notification',()=>{P('On iPhone and iPad, you can\'t type a reply right inside a notification for a web game. Apple only lets apps from the App Store do that. Instead, tap the notification. The game opens right to that conversation, already on the message box, so you can type your reply and send it.');P('On Android phones and computers using Chrome or Edge, notifications for chat, texts, and private messages also have a Reply button. Choose it to open the conversation, ready to type.')}],
  ['What\'s new',()=>{P(WHATSNEW)}]];
 {const NEW=['Levels, skills, and unlocks', 'Chat, voice chat, texts, and notifications', '24-hour food, drive-thrus, and health', 'Sound and volume', 'Banking, credit cards, and savings', 'Replying, reactions, and mentions', 'Combo meals', 'Switching jobs and trucking', 'Driving: self-driving and lane assist', 'Going back', 'Playing together: visits, gifts, and meet-ups', 'Private messages', 'How chat stays up to date', 'Chat: newest messages first, and opening from notifications', 'The new game link', 'Pets: age, training, and saying goodbye', 'Using your things and playing music', 'Hosting parties', 'Pet reminders and starting over', 'Nearby players and giving rides', 'Love: dating, engagement, and marriage', 'Bikes: buy one or rent one', 'Nature places', 'The food court', 'Main Street Business Center: shops', 'Phone cases, screen protectors, and chargers', 'New jobs: weddings, events, and nature', 'Voice chat anywhere', 'Tips as you play', 'Whose home is it', 'Weather and seasons', 'Replying from a notification', 'Battery saver', 'Answering calls and easy steps', 'States, distances, and Bluegrass Hollow', 'All 50 states and flying', 'Live weather, time zones, and your starting state', 'Horseback riding and feed stores', 'Personal care and your bathroom', "What's new"];const old=secs.filter(x=>!NEW.includes(x[0])),nw=NEW.map(n=>secs.find(x=>x[0]===n)).filter(Boolean);secs.length=0;secs.push(...old,...nw)}

/* ================= STATUS / STUFF / PHONE / SETTINGS ================= */
function statusScreen(){cur=statusScreen;const c=clock(),car=S.cars[S.car],J=curJob();screen('My status',()=>{
 P(`It is ${c.text} on ${c.dayName}, ${tzName()}. ${SEASON_DESC[season()]} Today's weather: ${weather()}. You are at ${placeName(S.loc)}.`,'st');
 P(`Cash ${money(S.cash)}. Bank ${money(S.bank)}. Loans owed ${money(S.loan)}.`);
 P(`Hunger ${level(S.hunger)}. Energy ${level(S.energy)}. Health ${Math.round(S.health)} out of 100.${drunk()>=2?' You are tipsy. No driving.':''}`);
 P(`Career: ${J?jobTitle()+', '+J.n+'. '+S.job.shifts+(J.task==='taxi'?' rides':' shifts')+' worked, '+money(S.job.earned||0)+' earned.':'no job yet. Visit the City Job Center.'}`);
 P(`Photo ID: ${S.hasID?'yes':'no'}. Driver's license: ${S.license?'yes':'no'}. Hunting license: ${S.huntLic?'yes':'no'}.`);
 P(car?`Main car: ${car.n}. ${fuelText(car)}. Condition ${Math.round(car.cond)} percent. Parked at ${placeName(S.carAt)}.`:'You don\'t own a car.');
 P(`Home: ${HOMES[S.home].name}.`);
 H2('Recent events');S.log.slice(0,8).forEach(l=>P(l));backTo(S.loc,'Back')},{focus:'#st'})}
function stuffScreen(){cur=stuffScreen;screen('My stuff',()=>{P(`Phone: ${S.phone||'none'}. PlayStation 5: ${S.ps?'yes':'no'}. Games: ${S.games.map(g=>GAMES[g].n).join(', ')||'none'}.`,'sf');
 P(`Clothes: ${S.clothes.length} items. ${outfit()}`);P(`Gear: ${S.gear.rod?'basic rod, ':''}${S.gear.prorod?'pro rod, ':''}${S.gear.bait||0} bait, ${S.gear.rifle?'hunting rifle, ':''}${S.gear.ammo||0} rounds of ammunition.`);
 P(`Armor: ${S.armor.map(a=>a.n).join(', ')||'none'}. Total protection ${armorProt()}.`);P(`Cooler: ${S.cooler.map(x=>x.lb+' pound '+x.n).join(', ')||'empty'}.`);
 if(S.stuff.length){H2('Use your things');P('Choose something to use it. Speakers and headphones play music, instruments play songs, and books, toys, and sports gear all do something.');const seen={};S.stuff.forEach((n,i)=>{if(seen[n])return;seen[n]=1;const c=S.stuff.filter(x=>x===n).length;B(`Use ${n}${c>1?', you have '+c:''}`,()=>useStuff(S.stuff.indexOf(n)),{k:'use:'+n})});if(MUSIC)B('Turn the music off',()=>{musicOff();say('The music is off.');refresh()},{k:'moff2'});H2('Everything else')}else P('Other things: nothing yet.');P(`${fridgeText()} Pets: ${S.pets.map(p=>p.name+' the '+p.b).join(', ')||'none'}.`);
 P(`Homes you own: ${S.homes.filter(h=>h!=='studio').map(h=>HOMES[h].name).join(', ')||'none yet, you rent a studio'}.`);
 if(S.cars.length)B('My cars',garage);backTo(S.loc,'Back')},{focus:'#sf'})}
function phoneScreen(){cur=phoneScreen;tone(1568,.1,{vol:.06});screen('Your '+S.phone,()=>{const nt=(S.texts||[]).length;P(`Your phone is unlocked.${(S.phoneGear||[]).length?' Accessories: '+S.phoneGear.join(', ')+'.':''}${CALL&&CALL.incoming?' Incoming call from '+CALL.with+'!':''}`,'ph');if(CALL)B(CALL.incoming&&!CALL.live?`Answer the call from ${CALL.with}`:`Go back to your call with ${CALL.with}`,callScreen);B('Friends: call and text',()=>{PHONE_BACK=true;friendsScreen()});B(`Messages, ${nt} ${nt===1?'text':'texts'}`,inboxScreen);B('Clock',()=>{const c=clock();say(`It's ${c.text}, ${c.dayName}, ${tzName()}.`)});
 B('Bank app: balance, deposits, cash and loan payments',bankApp);
 B('Ride app: get a taxi anywhere',rideApp);B('Food delivery app',deliveryApp);B('Jobs app',jobsApp);B('Weather app: live weather and tomorrow',()=>{say(wxFull())});backTo(S.loc,'Close your phone')},{focus:'#ph'})}
function rideApp(){cur=rideApp;screen('Ride app',()=>{P('Where to?','ra');Object.keys(PL).filter(id=>id!==S.loc&&id!=='street').forEach(id=>B(`${placeName(id)}, ${money(taxiFare(dist(S.loc,id)))}`,()=>travel(id,'taxi')));B('Close',phoneScreen)},{focus:'#ra'})}
function settingsScreen(){cur=settingsScreen;const st=S.settings;screen('Settings and help',()=>{
 H2('Progress');B('Achievements',achScreen);B('Daily quests',questScreen);B('How-to guide',()=>guideScreen(null));B('Save code: move your game to another device',saveCodeScreen);
 if(S.rent)B(`End your lease at ${HOMES[S.rent.h].name}`,endLease);
 H2('Your character');P(`Username: ${S.name||'not set'}.`);B('Describe my character',()=>say(describeMe()));B('Change my username and appearance',()=>charCreate(false));B('Start over: restart my progress and keep my username',startOverScreen,{k:'restart'});
 try{notifSettings()}catch(e){}
 H2('Announcer voice');B(`Announcer voice for wins, levels, and right or wrong answers: ${({f:'woman',m:'man',off:'off'})[S.settings.voice||'f']}. Change it`,()=>{const o=['f','m','off'];S.settings.voice=o[(o.indexOf(S.settings.voice||'f')+1)%3];save();vpre();voice('congratulations');say(S.settings.voice==='off'?'Announcer voice is off.':`Announcer voice is now a ${S.settings.voice==='m'?'man':'woman'}.`);refresh()},{k:'voice'});
 H2('Backup');P(S.cloud&&S.cloud.h?'Online backup is on.':'Online backup is off. Turn it on so your game is never lost.');B(S.cloud&&S.cloud.h?'Online backup settings and PIN':'Turn on online backup with a PIN',cloudScreen);
 if(S.cloud&&S.cloud.h)B('Turn off online backup',()=>{S.cloud=null;save();sfx.ok();say('Online backup is off. Your game is only saved on this device now.');refresh()},{k:'bkoff'});
 else B(`Remind me to turn on backup when I open the game: ${S.settings.bkRemind!==false?'on':'off'}`,()=>{S.settings.bkRemind=S.settings.bkRemind===false;save();refresh();say('Backup reminders '+(S.settings.bkRemind!==false?'on':'off'))},{k:'bkrem'});
 H2('Time zone');P(`Game time follows ${S.settings.tz==='town'?'the real time zone of the town you are in, '+tzName():S.settings.tz?TZ_LIST.find(z=>z[0]===S.settings.tz)[1]:'your phone\'s time zone, '+tzName()}. It is ${clock().text}.`);B('Change time zone',tzScreen);
 H2('Sound');P(`Volume ${Math.round(st.vol*100)} percent.`);B('Volume up',()=>{st.vol=clamp(st.vol+.1,0,1);applyVol();save();sfx.ok();say('Volume '+Math.round(st.vol*100)+' percent')},{k:'vu'});B('Volume down',()=>{st.vol=clamp(st.vol-.1,0,1);applyVol();save();sfx.ok();say('Volume '+Math.round(st.vol*100)+' percent')},{k:'vd'});
 B(`Background sounds: ${st.amb?'on':'off'}`,()=>{st.amb=!st.amb;applyVol();save();{const k=ambKey;if(k){stopAmb();ambKey=null;amb(k)}}refresh();say('Background sounds '+(st.amb?'on':'off'))},{k:'amb'});try{batterySettings()}catch(e){}
 [['ambVol','Background sounds, like crowds, traffic, and birds'],['wxVol','Weather sounds, like rain, wind, and thunder'],['sfxVol','Sound effects, like footsteps, doors, and cars'],['voxVol','Voices, like the announcer and voice messages']].forEach(([k,n])=>{const short=n.split(',')[0];P(`${n}: ${Math.round(lv(k)*100)} percent.`);
  B(`${short} louder`,()=>{st[k]=Math.round(clamp(lv(k)+.1,0,1.5)*10)/10;applyVol();save();k==='voxVol'?voice('correct'):sfx.ok();say(`${short} ${Math.round(st[k]*100)} percent.`);refresh()},{k:k+'+'});
  B(`${short} quieter`,()=>{st[k]=Math.round(clamp(lv(k)-.1,0,1.5)*10)/10;applyVol();save();k==='voxVol'?voice('correct'):sfx.ok();say(`${short} ${Math.round(st[k]*100)} percent.`+(st[k]===0?' Muted.':''));refresh()},{k:k+'-'})});
 H2('Other players');B(`Hear what nearby players are doing, like driving up or walking away: ${st.hearNear!==false?'on':'off'}`,()=>{st.hearNear=st.hearNear===false;save();refresh();say('Hearing nearby players '+(st.hearNear!==false?'on':'off'))},{k:'hearnear'});
 H2('Love and relationships');B(`What a partner calls you: ${S.relWord?{m:'boyfriend, fiancé, husband',w:'girlfriend, fiancée, wife',p:'partner, fiancé, spouse'}[S.relWord]:'not picked yet'}. Double-tap to change`,()=>relWordScreen(null),{k:'relword'});
 H2('Voice chat');B(`Who you talk with on voice chat: ${vcAll()?'Everyone online':'Nearby players only'}. Double-tap to change`,vcAllToggle,{k:'svcall'});
 H2('Tips');{const TM={first:'on, the first time you do something',always:'on all the time, every time you go somewhere',off:'off'};B(`Tips with steps for things in the game: ${TM[tipMode()]}. Double-tap to change`,()=>{const nx={first:'always',always:'off',off:'first'}[tipMode()];st.tips=nx;if(nx!=='off'){S.placesSeen={};LAST_PLACE=''}save();refresh();say('Tips '+TM[nx])},{k:'tipson'})}B('Hear all the tips',tipsScreen,{k:'tipsall'});
 H2('Pets');B(`Pets can pass away from old age or from going a week without food: ${st.petDeath!==false?'on':'off'}`,()=>{st.petDeath=st.petDeath===false;save();refresh();say('Pets passing away '+(st.petDeath!==false?'on':'off'))},{k:'pdeath'});
 H2('Accessibility');B(`Hold messages while I'm typing, good for braille displays: ${st.quietTyping!==false?'on':'off'}`,()=>{st.quietTyping=st.quietTyping===false;save();refresh();say('Hold messages while typing '+(st.quietTyping!==false?'on':'off'))},{k:'qt'});B(`Announce left and right for hunting and games: ${st.dir?'on':'off'}`,()=>{st.dir=!st.dir;save();refresh();say('Direction announcements '+(st.dir?'on':'off'))},{k:'dir'});
 B(`Extra time for timed actions: ${st.relaxed?'on':'off'}`,()=>{st.relaxed=!st.relaxed;save();refresh();say('Extra time '+(st.relaxed?'on':'off'))},{k:'rel'});
 B(`Practice mode, ignore store hours: ${st.ignoreHours?'on':'off'}`,()=>{st.ignoreHours=!st.ignoreHours;save();refresh();say('Practice mode '+(st.ignoreHours?'on. Every place is open.':'off. Places follow your real local time.'))},{k:'ign'});
 H2('How to play');P('Every screen has buttons. Swipe right to move through them and double tap to choose. Use Go somewhere to travel. Pick a place, then choose to walk, drive, take a taxi, or ride the bus. You travel there automatically. Stores and restaurants keep real hours based on your local time zone, which you can change in Settings. Earn money at the City Job Center, fishing, or hunting. Get a photo ID at the bank, then your driver\'s license at the DMV. Wear headphones for left and right sounds. Turn off silent mode on your phone so sounds can play.');
 H2('Save');P('Your game saves on this device automatically.');B('Start a brand new game',()=>{cur=null;screen('Start over?',()=>{P('This erases your progress.','so');B('Yes, erase everything and start over',()=>{S=defState();S.started=true;save();say('New game started.');placeScreen('home')});B('No, keep my game',settingsScreen)},{noNav:true,focus:'#so'})});
 backTo(S.loc,'Back to the game')})}

  const pay=r2((sub?40:55)+stops.length*(sub?8:15))*(1+.2*S.job.level);
  const ch=await quiz(`${jobTitle()} shift`,`Dispatch: "Your next trip is ${route}. ${stops.length} ${stops.length===1?'stop':'stops'}. It pays ${money(pay)}."`,['Take the trip','End your shift'],()=>ding());if(ch!=='Take the trip')break;

  skipFlag=false;screen(sub?'Running the subway':'Running the train',()=>{P(sub?'You climb into the front cab of the subway train and check your doors and brakes.':(S.job.level>=3?'You climb into the engine cab and start the locomotive.':'You check the tickets on your clipboard and step onto the train.'),'tp');B('Skip ahead',()=>{skipFlag=true})},{noNav:true,focus:'#tp'});
  const st=realPlay('inside-a-train',.7);let bad=0;
  try{await wait(3000);const evs=[];
   const sig=pick(SIGNALS);evs.push([sig[0]+' What do you do?',sig[1],shuffle(SIGNALS.map(x=>x[1]).filter(x=>x!==sig[1]))]);
   if(sub){evs.push([pick(['The train stops at the platform and the doors open. People are getting on. What do you say over the speaker?','It is time to leave the station. What do you say before the doors close?']),'Stand clear of the closing doors, please',['Hurry up, everybody','Doors closing, jump on now']],
    ['A passenger presses the help button. They say they feel very sick.','Call for help on the radio and hold the train at the next station',['Tell them to wait until the last stop','Keep driving and ignore it']],
    ['You see someone standing on the tracks ahead!','Hit the emergency brake and sound the horn',['Slow down a little','Keep going and hope they move']])}
   else{evs.push(['A railroad crossing is coming up. What do you do?','Blow the horn: long, long, short, long',['Speed up to get across fast','Stay quiet so you don\'t wake anyone']],
    ['A passenger does not have a ticket.','Sell them a ticket on board',['Make them get off in the woods','Pretend you didn\'t see them']],

    [`The train is pulling into ${PL[stops[0]].name}. What do you announce?`,`Now arriving at ${PL[stops[0]].name}`,[`Next stop, ${PL[pick(TRAIN_LINE.filter(x=>x!==stops[0]))].name}`,'Welcome aboard, this is the last stop']])}
   for(const ev of shuffle(evs).slice(0,3)){if(skipFlag)break;await wait(2500);const a=await quiz('On the job',ev[0],shuffle([ev[1],...ev[2]]),/railroad crossing/.test(ev[0])?()=>sfx.trainHorn():null);if(a===ev[1]&&/horn/.test(ev[1]))sfx.trainHorn();if(a===ev[1]){sfx.ok();await feedback('Good call','That\'s exactly right. Safety first!')}else{bad++;sfx.bad();await feedback('Careful!',`The right choice was: ${ev[1]}. Your pay is docked $15.`)}
    screen(sub?'Running the subway':'Running the train',()=>{P('The train rolls on down the tracks.','tp');B('Skip ahead',()=>{skipFlag=true})},{noNav:true,focus:'#tp'})}
   if(!skipFlag)await wait(2500);ding()}finally{st();skipFlag=false}
  const got=Math.max(0,pay-bad*15);S.bank+=got;earned+=got;runs++;S.job.shifts++;S.totalShifts=(S.totalShifts||0)+1;S.railRuns=(S.railRuns||0)+1;S.job.earned=r2((S.job.earned||0)+got);S.energy=clamp(S.energy-10,0,100);S.hunger=clamp(S.hunger-8,0,100);let promo='';
  if(S.job.level<3&&S.job.shifts>=[0,4,10,20][S.job.level+1]){S.job.level++;promo=` Your supervisor says, "Great work. You're promoted to ${jobTitle()}!"`;sfx.levelup()}sfx.register();save();
  await feedback('Trip finished',`${sub?'You brought the subway back to Union Station':'The train is back at Union Station'}. You earned ${money(got)}.${promo}`)}
 busy=false;skipFlag=false;await feedback('Shift over',`You finished ${runs} ${runs===1?'trip':'trips'} and earned ${money(earned)}.`);S.loc='train';save();placeScreen('train')}

/* ================= TURN-BY-TURN DIRECTIONS FOR AUTO-WALK AND DRIVING ================= */
function legSteps(x1,y1,x2,y2,t,first){const st=[],dx=x2-x1,dy=y2-y1,pl=n=>`${feetText(n)}, ${n} ${n===1?'block':'blocks'}`;
 if(!dx&&!dy)return st;
 if(dx){const h=dx>0?'east':'west';st.push(`${first?'Head':'Continue'} ${h} on ${ewName(y1,t)} for ${pl(Math.abs(dx))}.`);
  if(dy){const v=dy>0?'north':'south',left=(dx>0)===(dy>0);st.push(`Turn ${left?'left':'right'} onto ${nsName(x2,t)}, heading ${v}, and go ${pl(Math.abs(dy))}.`)}}
 else{const v=dy>0?'north':'south';st.push(`${first?'Head':'Continue'} ${v} on ${nsName(x1,t)} for ${pl(Math.abs(dy))}.`)}
 return st}
function routeSteps(from,to,mode){const A=PL[from],Bp=PL[to];if(!A||!Bp)return[];const name=placeName(to),side=((Bp.x+Bp.y)%2===0)?'right':'left';let st=[];
 if(A.town===Bp.town){st=legSteps(A.x,A.y,Bp.x,Bp.y,A.town,true)}
 else{const TA=TOWNS[A.town],TB=TOWNS[Bp.town];st=legSteps(A.x,A.y,0,0,A.town,true);
  st.push(`${mode==='walk'?'Follow':'Merge onto'} the interstate toward ${TB.n}, ${stateOf(Bp.town)}. It's about ${townMiles(A.town,Bp.town)} miles.`);if(stateOf(A.town)!==stateOf(Bp.town))st.push(`You cross the state line. A big sign says, Welcome to ${stateOf(Bp.town)}!`);
  st.push(`Take the exit for ${TB.n} and turn onto ${ewName(0,Bp.town)}.`);st=st.concat(legSteps(0,0,Bp.x,Bp.y,Bp.town,false))}
 st.push(`${name} is on your ${side}.`);return st}
let DIR_T=[];function stopDirections(){DIR_T.forEach(clearTimeout);DIR_T=[]}
function runDirections(steps,totalMs){stopDirections();if(!steps.length)return;const gap=Math.max(1800,(totalMs-1500)/Math.max(1,steps.length));steps.forEach((s,i)=>{DIR_T.push(setTimeout(()=>{if(!skipFlag)say(s)},1500+i*gap))})}

function relReqScreen(){cur=relReqScreen;const L=(S.relReqs||[]).filter(r=>Date.now()-r.t<7*864e5);S.relReqs=L;screen('Love and relationship requests',()=>{P(L.length?`You have ${L.length} ${L.length===1?'request':'requests'}.`:'No requests right now.','rr');
